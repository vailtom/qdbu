[package]
name = "qdbu"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }
# So para o carimbo de linkedicao do build.rs. E dependencia de BUILD: nao entra
# no binario, e nao custa download -- o chrono ja estava na arvore do tauri.
# `default-features = false` com `clock` pega a hora local sem arrastar o resto.
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = "0.8"
tauri-plugin-dialog = "2.0.0-rc.8"

[profile.release]
opt-level = "s"
lto = true
strip = true
