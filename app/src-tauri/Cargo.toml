[package]
name = "qdbu"
version = "0.76.0"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }
# So para o carimbo de linkedicao do build.rs. E dependencia de BUILD: nao entra
# no binario, e nao custa download -- o chrono ja estava na arvore do tauri.
# `default-features = false` com `clock` pega a hora local sem arrastar o resto.
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = "0.8"
tauri-plugin-dialog = "2.0.0-rc.8"
# A chamada ao modelo de linguagem (src/ia.rs). O reqwest ja vinha pelo Tauri,
# mas SEM TLS -- e https://api.openai.com nao fala sem. `native-tls` e o
# schannel do proprio Windows: nenhuma DLL a mais no pacote (o alvo e so
# Windows), nenhum build em C. A alternativa, rustls 0.23, arrasta aws-lc-rs
# compilado por CMake -- um poco num alvo i686, para ganhar nada aqui.
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls"] }
# Hora local para o historico da IA (`.qdbu/ia/AAAAMMDD.jsonl`). O Rust so tinha
# tempo RELATIVO (o "[t+0.687s]" do log), que nao data uma linha que alguem vai
# ler meses depois. Mesmo chrono do build.rs, sem download novo.
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
